<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rasmalak — Lesson Intro Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#F5F0EB; --bg-card:#FFFFFF; --bg-dark:#0F1914;
    --primary:#2D6A4F; --primary-light:#F0F7F4; --gold:#D97706;
    --ink:#16211C; --ink-inv:#F5F0EB; --muted:#5C6B63;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e7e0d7;font-family:'Inter',system-ui,sans-serif;color:var(--ink);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
  .controls button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;
       background:var(--bg-card);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.08);font-size:14px}
  .controls button.active{background:var(--primary);color:#fff}
  .note{font-size:12px;color:#6b6258;max-width:860px;text-align:center;line-height:1.5}

  /* 16:9 stage at 960x540 */
  .stage{position:relative;width:960px;max-width:96vw;aspect-ratio:16/9;border-radius:16px;overflow:hidden;
         box-shadow:0 30px 80px rgba(0,0,0,.28);background:var(--bg-page)}
  .bg{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 8%,var(--primary-light),var(--bg-page) 58%);
      animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{0%{background-position:32% 0}100%{background-position:68% 16%}}
  .corner{position:absolute;top:26px;inset-inline-end:34px;display:flex;align-items:center;gap:8px;
          color:var(--primary);font-weight:700;font-size:15px;opacity:.85;z-index:3}
  .corner .badge{width:22px;height:22px;border-radius:7px;background:var(--primary);color:#fff;
          display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .progress{position:absolute;left:0;bottom:0;height:5px;background:var(--primary);width:0;z-index:5}

  .scene{position:absolute;inset:0;padding:70px;display:flex;flex-direction:column;justify-content:center;
         opacity:0;transition:opacity .4s ease;z-index:2}
  .scene.show{opacity:1}
  .scene.top{justify-content:flex-start}

  .kicker{color:var(--gold);font-weight:700;font-size:20px;margin-bottom:6px}
  .title{font-weight:800;font-size:59px;line-height:1.1}
  .brandbig{position:absolute;top:50px;inset-inline-start:70px;display:flex;align-items:center;gap:8px;
            color:var(--primary);font-weight:700;font-size:22px}
  .brandbig .badge{width:26px;height:26px;border-radius:8px;background:var(--primary);color:#fff;
            display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .u{height:5px;background:var(--gold);border-radius:3px;margin-top:12px;width:0;transition:width .5s ease}
  .scene.show .u{width:150px}

  .hookline{font-weight:800;font-size:44px;line-height:1.25;max-width:760px}
  .heading{font-weight:800;font-size:32px}
  .caption{font-size:18px;color:var(--muted);margin-top:4px}

  .cards{display:flex;gap:20px;margin-top:30px}
  .card{flex:1;background:var(--bg-card);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px;
        opacity:.82;transform:scale(1);transition:all .35s ease;box-shadow:0 8px 22px rgba(45,106,79,.10);
        outline:3px solid transparent}
  .card .n{width:40px;height:40px;border-radius:12px;background:var(--primary-light);color:var(--primary);
        font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .35s}
  .card .t{font-weight:700;font-size:23px;line-height:1.3}
  .card.on{opacity:1;transform:scale(1.05);outline-color:var(--gold);box-shadow:0 18px 38px rgba(45,106,79,.22)}
  .card.on .n{background:var(--gold);color:#fff}

  .chart{display:flex;align-items:flex-end;gap:36px;height:235px;margin-top:52px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:9px;transition:transform .35s}
  .bar .pct{font-weight:800;font-size:27px}
  .bar .col{width:100%;height:0;border-radius:10px 10px 0 0;transition:height .8s cubic-bezier(.2,.8,.2,1);outline:3px solid transparent;outline-offset:3px}
  .bar .lbl{font-weight:700;font-size:20px}
  .bar.on{transform:scale(1.04)}
  .bar.on .col{outline-color:var(--gold)}

  .recapH{font-weight:800;font-size:36px;color:var(--primary)}
  .recapB{font-size:25px;line-height:1.45;max-width:760px;margin-top:14px}

  .outro{position:absolute;inset:0;background:var(--bg-dark);color:var(--ink-inv);display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:12px;opacity:0;transition:opacity .4s ease;z-index:4}
  .outro.show{opacity:1}
  .outro .brandbig2{display:flex;align-items:center;gap:10px;color:var(--primary);font-weight:700;font-size:26px}
  .outro .brandbig2 .badge{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;
         display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  .outro .cta{font-weight:800;font-size:46px;margin-top:8px}
  .outro .sub{font-size:22px;color:var(--primary-light)}
</style>
</head>
<body>
  <div class="controls">
    <button id="ar" class="active">العربية (RTL)</button>
    <button id="en">English (LTR)</button>
    <span style="width:14px"></span>
    <button id="replay">↻ Replay</button>
    <button id="speed">Speed: 1×</button>
  </div>

  <div class="stage" id="stage">
    <div class="bg"></div>
    <div class="corner"><span class="badge" id="cbadge">ر</span><span id="cbrand">رَسمالَك</span></div>
    <div id="scenes"></div>
    <div class="progress" id="prog"></div>
  </div>
  <div class="note" id="note"></div>

<script>
const C = {
  ar:{dir:'rtl',font:"'Cairo',sans-serif",brand:'رَسمالَك',
    course:'أساسيات المال',lesson:'الدرس الأول',title:'ما هو المال حقًّا؟',
    hook:'معظمنا لم يتعلّم قطّ كيف يعمل المال — رغم أننا نستخدمه كل يوم.',
    cHead:'المال أداة — وله ثلاث وظائف',cards:['وسيلة للتبادل','مخزن للقيمة','وحدة للقياس'],
    dHead:'قاعدة ٥٠ / ٣٠ / ٢٠',dCap:'طريقة بسيطة لتقسيم دخلك الشهري.',
    bars:[['احتياجات',50,'var(--primary)'],['رغبات',30,'var(--gold)'],['ادّخار',20,'var(--bg-dark)']],
    rHead:'من المال إلى خطّة',rBody:'عندما تفهم وظيفة المال، تتحوّل الميزانية من قيدٍ إلى أداةٍ للحرية.',
    cta:'ابدأ الدرس الأول',sub:'مجّانًا على رَسمالَك'},
  en:{dir:'ltr',font:"'Inter',sans-serif",brand:'Rasmalak',badge:'R',
    course:'Foundations of Money',lesson:'Lesson 1',title:'What Money Really Is',
    hook:'Most of us were never taught how money actually works — even though we use it every day.',
    cHead:'Money is a tool — with three jobs',cards:['A medium of exchange','A store of value','A unit of account'],
    dHead:'The 50 / 30 / 20 rule',dCap:'A simple way to split your monthly income.',
    bars:[['Needs',50,'var(--primary)'],['Wants',30,'var(--gold)'],['Savings',20,'var(--bg-dark)']],
    rHead:'From money to a plan',rBody:'Once you understand what money is for, a budget stops being a limit and becomes a tool for freedom.',
    cta:'Start Lesson 1',sub:'Free on Rasmalak'}
};
// Scene durations (ms) mirror the fallback timeline in content.ts.
const SCENES=[['title',6000],['hook',14000],['concept',28000],['data',32000],['recap',22000],['outro',16000]];
const TOTAL=SCENES.reduce((s,x)=>s+x[1],0);

let locale='ar', speed=1, start=performance.now();

function build(){
  const c=C[locale];
  document.documentElement.lang=locale; document.documentElement.dir=c.dir;
  document.getElementById('stage').style.fontFamily=c.font;
  document.getElementById('cbrand').textContent=c.brand;
  document.getElementById('cbadge').textContent=locale==='ar'?'ر':'R';
  const badge=locale==='ar'?'ر':'R';
  document.getElementById('scenes').innerHTML=`
    <div class="scene" data-s="title">
      <div class="brandbig"><span class="badge">${badge}</span>${c.brand}</div>
      <div class="kicker">${c.course} · ${c.lesson}</div>
      <div class="title">${c.title}</div><div class="u"></div>
    </div>
    <div class="scene" data-s="hook">
      <div class="hookline">${c.hook}</div><div class="u"></div>
    </div>
    <div class="scene" data-s="concept">
      <div class="heading">${c.cHead}</div><div class="u"></div>
      <div class="cards">${c.cards.map((t,i)=>`<div class="card" data-i="${i}"><div class="n">${i+1}</div><div class="t">${t}</div></div>`).join('')}</div>
    </div>
    <div class="scene top" data-s="data">
      <div class="heading">${c.dHead}</div><div class="caption">${c.dCap}</div>
      <div class="chart">${c.bars.map((b,i)=>`<div class="bar" data-i="${i}"><div class="pct" style="color:${b[2]}">0%</div><div class="col" style="background:${b[2]}" data-h="${b[1]}"></div><div class="lbl">${b[0]}</div></div>`).join('')}</div>
    </div>
    <div class="scene" data-s="recap">
      <div class="recapH">${c.rHead}</div><div class="recapB">${c.rBody}</div><div class="u"></div>
    </div>
    <div class="outro" data-s="outro">
      <div class="brandbig2"><span class="badge">${badge}</span>${c.brand}</div>
      <div class="cta">${c.cta}</div><div class="sub">${c.sub}</div>
    </div>`;
  start=performance.now();
}

function tick(now){
  const el=((now-start)*speed)%TOTAL;
  document.getElementById('prog').style.width=(el/TOTAL*100)+'%';
  // active scene + local time
  let acc=0, idx=0, local=0;
  for(let i=0;i<SCENES.length;i++){ if(el<acc+SCENES[i][1]){idx=i;local=el-acc;break;} acc+=SCENES[i][1]; }
  const activeId=SCENES[idx][0], dur=SCENES[idx][1];
  const fade = local<400?local/400 : (local>dur-400?(dur-local)/400:1);
  document.querySelectorAll('.scene').forEach(s=>{
    const on=s.dataset.s===activeId && activeId!=='outro';
    s.classList.toggle('show',on); s.style.opacity=on?Math.max(0,fade):0;
  });
  const outro=document.querySelector('.outro');
  const oOn=activeId==='outro'; outro.classList.toggle('show',oOn); outro.style.opacity=oOn?Math.max(0,fade):0;

  // concept highlight stepping (starts at 35% of scene)
  if(activeId==='concept'){
    const startF=dur*0.35, seg=(dur-startF-200)/3;
    const ai=local<startF?-1:Math.min(2,Math.floor((local-startF)/seg));
    document.querySelectorAll('.scene[data-s=concept] .card').forEach(cd=>cd.classList.toggle('on',+cd.dataset.i===ai));
  }
  // data bars grow + highlight
  if(activeId==='data'){
    document.querySelectorAll('.scene[data-s=data] .bar').forEach((bar)=>{
      const i=+bar.dataset.i, reveal=dur*(0.12+i*0.16), col=bar.querySelector('.col');
      if(local>reveal){ col.style.height=(col.dataset.h/50*160)+'px'; bar.querySelector('.pct').textContent=col.dataset.h+'%'; }
      else { col.style.height='0px'; bar.querySelector('.pct').textContent='0%'; }
      const startF=dur*0.5, seg=(dur-startF-200)/3;
      const ai=local<startF?-1:Math.min(2,Math.floor((local-startF)/seg));
      bar.classList.toggle('on',i===ai);
    });
  }
  requestAnimationFrame(tick);
}

document.getElementById('ar').onclick=()=>{locale='ar';setActive('ar');build();};
document.getElementById('en').onclick=()=>{locale='en';setActive('en');build();};
document.getElementById('replay').onclick=()=>{start=performance.now();};
document.getElementById('speed').onclick=(e)=>{speed=speed===1?2:1;e.target.textContent='Speed: '+speed+'×';};
function setActive(id){document.getElementById('ar').classList.toggle('active',id==='ar');document.getElementById('en').classList.toggle('active',id==='en');}
document.getElementById('note').textContent='Visual preview (approximation of the Remotion render) for quick checking — not the final MP4. Toggle AR/EN, replay, or 2× speed. Full-quality output comes from `npm run render:all`.';

build();
requestAnimationFrame(tick);
</script>
</body>
</html>
